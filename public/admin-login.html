<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-header .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 1.5rem;
      font-weight: 800;
      color: #111;
      text-decoration: none;
      margin-bottom: 8px;
    }
    .login-header h1 { font-size: 1.3rem; font-weight: 700; margin-top: 16px; }
    .login-header p { color: #6b7280; font-size: 0.9rem; margin-top: 4px; }
    .admin-badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(124,58,237,0.1);
      color: #7c3aed;
      font-size: 0.7rem;
      font-weight: 700;
      border-radius: 100px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #1f2937;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: all 0.3s;
      background: #f9fafb;
      font-family: 'Inter', -apple-system, sans-serif;
    }
    .form-group input:focus {
      outline: none;
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124,58,237,0.1);
      background: #fff;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.3s;
      width: 100%;
      font-family: 'Inter', -apple-system, sans-serif;
    }
    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #5b21b6);
      color: white;
      box-shadow: 0 4px 14px rgba(124,58,237,0.35);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(124,58,237,0.45); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }
    .error-message {
      background: #fee2e2;
      color: #dc2626;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
    }
    .error-message.show { display: block; }
    .back-link {
      text-align: center;
      margin-top: 20px;
    }
    .back-link a {
      color: #6b7280;
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .back-link a:hover { color: #7c3aed; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <a href="/" class="logo" id="storeLogo">
          <span id="storeName">Admin</span>
        </a>
        <div>
          <span class="admin-badge">Admin</span>
          <h1>Welcome Back</h1>
          <p>Sign in to manage your store</p>
        </div>
      </div>
      <div class="error-message" id="errorMessage"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="Enter your email" required autocomplete="email" autofocus>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span>Sign In</span>
        </button>
      </form>
      <div class="back-link">
        <a href="/">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          Back to Store
        </a>
      </div>
    </div>
  </div>

  <script>
    // Load store name from database
    fetch('/api/settings').then(r => r.json()).then(s => {
      const name = s.store_name || s.store_logo || 'Store';
      document.getElementById('storeName').textContent = name;
      document.title = name + ' -- Admin Login';
      // Set placeholder to admin email hint from settings (never expose the real email in source)
      document.getElementById('email').placeholder = s.admin_email ? 'Enter admin email' : 'Enter your email';
    }).catch(() => {});

    const form = document.getElementById('loginForm');
    const btn = document.getElementById('loginBtn');
    const errorDiv = document.getElementById('errorMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.classList.remove('show');
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.innerHTML = 'Signing in...';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Login failed');
        }

        localStorage.setItem('admin_token', data.token);
        localStorage.setItem('admin_email', data.email);
        window.location.href = '/admin';
      } catch (err) {
        errorDiv.textContent = err.message || 'Invalid credentials. Please try again.';
        errorDiv.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>Sign In</span>';
      }
    });

    // Check if already logged in
    const token = localStorage.getItem('admin_token');
    if (token) {
      fetch('/api/admin/verify', {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(res => {
        if (res.ok) window.location.href = '/admin';
        else localStorage.removeItem('admin_token');
      })
      .catch(() => localStorage.removeItem('admin_token'));
    }
  </script>
</body>
</html>
